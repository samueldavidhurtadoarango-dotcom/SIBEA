<header class="br-barra-aprendiz">
  <div class="br-barra-aprendiz__dentro">
    <span class="br-barra-aprendiz__marca">BenefitRack</span>
    <div class="br-barra-aprendiz__derecha">
      <span class="br-barra-aprendiz__saludo">Hola, {{nombre}}</span>
      <div class="br-campanita-caja">
        <button type="button" class="br-campanita" aria-label="Avisos, {{avisos}} sin leer" aria-haspopup="true" aria-expanded="false">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span class="br-campanita__contador" aria-hidden="true">{{avisos}}</span>
        </button>
      </div>
      <a href="#" class="br-barra-aprendiz__salir">Salir</a>
    </div>
  </div>
</header>
